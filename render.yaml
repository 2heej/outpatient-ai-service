services:
  - type: web
    name: opd-ai-service-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: USE_LLM_SUMMARY
        value: "true"
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: DAILY_LLM_CALL_CAP
        value: "50"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CORS_ORIGINS
        sync: false
