services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opd
      POSTGRES_PASSWORD: opd
      POSTGRES_DB: opd
    ports:
      - "5432:5432"
    volumes:
      - opd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://opd:opd@db:5432/opd
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  opd_pg_data:
